apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: lms-ns
  labels:
    app: frontend-label
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-label
  template:
    metadata:
      labels:
        app: frontend-label
    spec:
      containers:
      - name: frontend
        image: sach990p/lms-frontend:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
          - configMapRef:
             name: lms-configmap
          - secretRef:
             name: lms-secrets